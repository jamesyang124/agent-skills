name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate SKILL.md files and links
        run: scripts/validate-skills.sh
      - name: skills CLI discovers every skill
        run: |
          found=$(npx -y skills add . --list 2>&1 | sed 's/\x1b\[[0-9;?]*[A-Za-z]//g' | sed -n 's/.*Found \([0-9]*\) skills.*/\1/p')
          expected=$(ls -d skills/*/ | wc -l)
          echo "found=$found expected=$expected"
          [ "$found" -eq "$expected" ]
